#                                    !!MONITORS!!                                   #
# --------------------------------------------------------------------------------- #
#                                    !!MONITORS!!                                   #

# Make sure to customize monitors! This is just my setup so you get an idea.
# run `hyprctl monitors all` to see all your monitors!!!
# MacBook Pro 2015 Retina panel: let Hyprland pick the native mode and scale 2x like macOS does.
# (13" = 2560x1600, 15" = 2880x1800). Use 1.6 or 1.5 if 2x feels too big.
monitor=eDP-1, preferred, auto, 1.25


# Polkit agents & auth
# You can use whichever one you prefer, but the command would vary.
exec-once = systemctl --user start hyprpolkitagent


# Startup programs, these are mine, most likely you'll have these as well.
exec-once = nm-applet
exec-once = hyprpaper
exec-once = quickshell
exec-once = hyprctl setcursor Hackneyed-24px 24


# Default programs, these are what I prefer.
$terminal = kitty
$fileManager = nemo

# TODO:
# This command calls the quickshell IPC to open the app launcher for the currently focused window.
# I know it's a bit messy, I might make this cleaner eventually with a build-in quickshell functionality.
$menu = quickshell ipc call appLauncher_$(hyprctl monitors -j | jq -r '.[] | select(.focused == true) | .name') toggleAppLauncher


# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24



#                                    !!INPUT!!                                      #
# --------------------------------------------------------------------------------- #
#                                    !!INPUT!!                                      #

# READ https://wiki.hyprland.org/Configuring/Variables/#input IF CONFUSED!
# Example keyboard/mouse input settings.
input {
    # Switch layout with Ctrl + Space (same as macOS "select previous input source").
    # Alt+Shift is left free because Option+Shift is used for typing special characters/selecting words.
    kb_layout = us,se
    kb_options = grp:ctrl_space_toggle

    # Set as needed
    kb_rules = 
    kb_variant =
    kb_model =

    follow_mouse = 1

    # Range is -1.0 to 1.0 | 0 means no modification to sensitivity.
    sensitivity = 0 

    # macOS-style trackpad behaviour
    touchpad {
        natural_scroll = true
        tap-to-click = true
        # Two-finger click = right click (like macOS), instead of bottom-right corner
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# This fixes a few bugs.
cursor {
  no_hardware_cursors = true
}


#                                    !!DESIGN!!                                     #
# --------------------------------------------------------------------------------- #
#                                    !!DESIGN!!                                     #

animations {
    enabled = false
}

# The gaps between windows, as well as border colors.
# proportional to the taskbar values.
general {
    # Inner and Outer gaps between windows.
    gaps_in = 5
    gaps_out = 10

    # I prefer a thin border
    border_size = 1

    # Border colors.
    col.active_border = rgb(d8d8d8)
    col.inactive_border = rgb(9b9b9b)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    layout = dwindle

    # READ https://wiki.hyprland.org/Configuring/Tearing/ BEFORE TURNING ON!
    allow_tearing = false
}

# Window Decorations! Shadow, Blur, etc.
decoration {
    # 8px same as taskbar, change if wanted.
    rounding = 0

    # I want transparancy to not change, since we have the colored border.
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Window Shadow
    shadow:enabled = true
    shadow:range = 2
    shadow:render_power = 5
    shadow:sharp = false
    shadow:color = rgba(0,0,0,0.85)
    shadow:offset = 2 2
    shadow:scale = 1

    # Transparent Window Blur
    blur:enabled = false
}

# Read https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more info on dwindle layout.
dwindle {
    preserve_split = true
}

# Read https://wiki.hyprland.org/Configuring/Master-Layout/ for more info on master layout.
master {
    new_status = master
}

# We have our own wallpapers :) So I'll disable default things.
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#                                    !!KEYBINDS!!                                   #
# --------------------------------------------------------------------------------- #
#                                    !!KEYBINDS!!                                   #

# macOS-style keybinds.
# On a MacBook, the Command key is SUPER in Linux and Option is ALT, so Cmd = $mainMod.
$mainMod = SUPER

# Helper script that turns Cmd+<key> into Ctrl+<key> (or Ctrl+Shift+<key> in terminals).
# Put it at ~/.config/hypr/scripts/mac-shortcut.sh and `chmod +x` it.
$macsc = ~/.config/hypr/scripts/mac-shortcut.sh

# --- Gestures -------------------------------------------------------------------
# Three-finger swipe left/right to switch workspaces (like Spaces on macOS).
# Hyprland 0.51+. On older versions use:  gestures { workspace_swipe = true }
gesture = 3, horizontal, workspace

# --- Launching things -----------------------------------------------------------
# Cmd + Space = launcher (Spotlight)
bind = $mainMod, SPACE, exec, $menu
# Ctrl + Option + T = terminal, Ctrl + Option + F = file manager (Finder)
bind = CTRL ALT, T, exec, $terminal
bind = CTRL ALT, F, exec, $fileManager

# --- App / window management ----------------------------------------------------
# Cmd + Q = quit (closes the focused window)
bind = $mainMod, Q, killactive,
# Cmd + Option + Esc = Force Quit (click the window you want to kill)
bind = $mainMod ALT, Escape, exec, hyprctl kill
# Cmd + Ctrl + F = full screen
bind = $mainMod CTRL, F, fullscreen
# Cmd + Shift + Space = toggle floating / tiled
bind = $mainMod SHIFT, SPACE, togglefloating
# Cmd + M = minimize (sends window to a hidden workspace), Cmd + Shift + M = show minimized windows
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized
# Cmd + Tab / Cmd + Shift + Tab = cycle windows
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, bringactivetotop,
# Cmd + Ctrl + Q = lock screen (needs hyprlock/hypridle or any session locker)
bind = $mainMod CTRL, Q, exec, loginctl lock-session

# Focus windows with Ctrl + Option + arrows (Cmd + arrows are used for text editing below)
bind = CTRL ALT, left, movefocus, l
bind = CTRL ALT, right, movefocus, r
bind = CTRL ALT, up, movefocus, u
bind = CTRL ALT, down, movefocus, d

# --- Workspaces (Spaces) --------------------------------------------------------
# Ctrl + Left/Right = previous/next workspace
bind = CTRL, left, workspace, e-1
bind = CTRL, right, workspace, e+1
# Ctrl + Shift + Left/Right = move window to previous/next workspace and follow it
bind = CTRL SHIFT, left, movetoworkspace, e-1
bind = CTRL SHIFT, right, movetoworkspace, e+1

# Ctrl + [0-9] = go to workspace
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9, workspace, 9
bind = CTRL, 0, workspace, 10

# Ctrl + Shift + [0-9] = move window to workspace
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9
bind = CTRL SHIFT, 0, movetoworkspace, 10

# Move and Resize windows with Cmd + LMB/RMB and dragging.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots (MUST HAVE HYPRSHOT INSTALLED) ---------------------------------
# Cmd + Shift + 3 = whole screen, 4 = selected area, 5 = a window
bind = $mainMod SHIFT, 3, exec, hyprshot --mode output --output-folder ~/Pictures/Screenshots
bind = $mainMod SHIFT, 4, exec, hyprshot --mode region --output-folder ~/Pictures/Screenshots
bind = $mainMod SHIFT, 5, exec, hyprshot --mode window --output-folder ~/Pictures/Screenshots
# Add Ctrl to copy to the clipboard only
bind = $mainMod CTRL SHIFT, 3, exec, hyprshot --mode output --clipboard-only
bind = $mainMod CTRL SHIFT, 4, exec, hyprshot --mode region --clipboard-only
bind = $mainMod CTRL SHIFT, 5, exec, hyprshot --mode window --clipboard-only

# --- Text editing / navigation (the macOS cursor keys) ---------------------------
# Cmd + arrows = line start/end, document start/end
binde = $mainMod, left, sendshortcut, , Home, activewindow
binde = $mainMod, right, sendshortcut, , End, activewindow
binde = $mainMod, up, sendshortcut, CTRL, Home, activewindow
binde = $mainMod, down, sendshortcut, CTRL, End, activewindow
binde = $mainMod SHIFT, left, sendshortcut, SHIFT, Home, activewindow
binde = $mainMod SHIFT, right, sendshortcut, SHIFT, End, activewindow
binde = $mainMod SHIFT, up, sendshortcut, CTRL SHIFT, Home, activewindow
binde = $mainMod SHIFT, down, sendshortcut, CTRL SHIFT, End, activewindow
# Option + arrows = move by word
binde = ALT, left, sendshortcut, CTRL, Left, activewindow
binde = ALT, right, sendshortcut, CTRL, Right, activewindow
binde = ALT SHIFT, left, sendshortcut, CTRL SHIFT, Left, activewindow
binde = ALT SHIFT, right, sendshortcut, CTRL SHIFT, Right, activewindow
# Option + Backspace = delete word, Cmd + Backspace = delete to start of line
binde = ALT, BackSpace, exec, $macsc wordel
bind = $mainMod, BackSpace, exec, $macsc linedel
# Cmd + [ / ] = back / forward (browsers, file managers)
bind = $mainMod, bracketleft, sendshortcut, ALT, Left, activewindow
bind = $mainMod, bracketright, sendshortcut, ALT, Right, activewindow

# --- Cmd shortcuts inside apps (Cmd+C, Cmd+V, Cmd+T, ...) -------------------------
bind = $mainMod, A, exec, $macsc a
bind = $mainMod, B, exec, $macsc b
bind = $mainMod, C, exec, $macsc c
bind = $mainMod, D, exec, $macsc d
bind = $mainMod, F, exec, $macsc f
bind = $mainMod, G, exec, $macsc g
bind = $mainMod, I, exec, $macsc i
bind = $mainMod, K, exec, $macsc k
bind = $mainMod, L, exec, $macsc l
bind = $mainMod, N, exec, $macsc n
bind = $mainMod, O, exec, $macsc o
bind = $mainMod, P, exec, $macsc p
bind = $mainMod, R, exec, $macsc r
bind = $mainMod, S, exec, $macsc s
bind = $mainMod, T, exec, $macsc t
bind = $mainMod, U, exec, $macsc u
bind = $mainMod, V, exec, $macsc v
bind = $mainMod, W, exec, $macsc w
bind = $mainMod, X, exec, $macsc x
bind = $mainMod, Z, exec, $macsc z
bind = $mainMod, comma, exec, $macsc comma
bind = $mainMod, equal, exec, $macsc equal
bind = $mainMod, minus, exec, $macsc minus
# Shift variants (redo, reopen tab, new private window, find previous, ...)
bind = $mainMod SHIFT, G, exec, $macsc g SHIFT
bind = $mainMod SHIFT, N, exec, $macsc n SHIFT
bind = $mainMod SHIFT, P, exec, $macsc p SHIFT
bind = $mainMod SHIFT, T, exec, $macsc t SHIFT
bind = $mainMod SHIFT, Z, exec, $macsc z SHIFT
# Cmd + [0-9] = jump to tab / reset zoom
bind = $mainMod, 1, exec, $macsc 1
bind = $mainMod, 2, exec, $macsc 2
bind = $mainMod, 3, exec, $macsc 3
bind = $mainMod, 4, exec, $macsc 4
bind = $mainMod, 5, exec, $macsc 5
bind = $mainMod, 6, exec, $macsc 6
bind = $mainMod, 7, exec, $macsc 7
bind = $mainMod, 8, exec, $macsc 8
bind = $mainMod, 9, exec, $macsc 9
bind = $mainMod, 0, exec, $macsc 0

# --- MacBook function keys --------------------------------------------------------
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
# Keyboard backlight (F5/F6 on a 2015 MacBook Pro)
bindel = ,XF86KbdBrightnessUp, exec, brightnessctl -d 'smc::kbd_backlight' s 10%+
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d 'smc::kbd_backlight' s 10%-
# Media keys (F7-F9)
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioNext, exec, playerctl next



